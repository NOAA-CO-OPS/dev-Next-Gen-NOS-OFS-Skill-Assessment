name: Weekly and Season-to-Date Ice Skill Assessment

on:
  schedule:
    - cron: '0 10 * * *' # Every day at 6 AM EDT (10:00 UTC)
    - cron: '0 2 * * 1'  # Sunday night at 10 PM EDT (02:00 UTC Monday)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-skill-assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: 'ice-tuneup'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib basemap plotly scipy scikit-learn pillow
          pip install -e .

      - name: Calculate Previous Day & Run Daily Scenario
        run: |
          DAILY_START=$(date -d "yesterday" -u +'%Y-%m-%dT00:00:00Z')
          DAILY_END=$(date -u +'%Y-%m-%dT00:00:00Z')

          echo "=== RUNNING PREVIOUS DAY SCENARIO ($DAILY_START to $DAILY_END) ==="
          python bin/utils/do_iceskill_all_GLOFS.py \
            -p ./ \
            -s $DAILY_START \
            -e $DAILY_END \
            -ws nowcast \
            -ts daily

          # Move Daily Outputs to a dedicated folder
          mkdir -p output_daily
          cp -r data/visuals/om_files_ice/* output_daily/
          cp data/visuals/visual_ice_stats/* output_daily/
          rm -rf data/visuals/om_files_ice/*

      - name: Restore Weekly and Seasonal Data (Daily Runs)
        if: github.event.schedule != '0 2 * * 1'
        uses: actions/cache/restore@v4
        with:
          path: |
            output_weekly
            output_season
          key: weekly-season-data-${{ github.run_id }}
          restore-keys: |
            weekly-season-data-

      - name: Calculate Date Ranges & Run Weekly Scenario
        if: github.event.schedule == '0 2 * * 1'
        run: |
          # HARDCODED DATES FOR TESTING
          WEEKLY_START="2026-02-01T00:00:00Z"
          END_DATE="2026-02-08T23:59:59Z"

          echo "=== RUNNING WEEKLY SCENARIO ($WEEKLY_START to $END_DATE) ==="
          python bin/utils/do_iceskill_all_GLOFS.py \
            -p ./ \
            -s $WEEKLY_START \
            -e $END_DATE \
            -ws nowcast \
            -ts daily

          # Move Weekly Outputs to a dedicated folder
          mkdir -p output_weekly
          cp -r data/visuals/om_files_ice/* output_weekly/
          cp data/visuals/visual_ice_stats/* output_weekly/
          rm -rf data/visuals/om_files_ice/*

      - name: Calculate Season-to-Date & Run Season Scenario
        if: github.event.schedule == '0 2 * * 1'
        run: |
          # HARDCODED DATES FOR TESTING
          SEASON_START="2026-02-01T00:00:00Z"
          END_DATE="2026-02-08T23:59:59Z"

          echo "=== RUNNING SEASON-TO-DATE SCENARIO ($SEASON_START to $END_DATE) ==="
          python bin/utils/do_iceskill_all_GLOFS.py \
            -p ./ \
            -s $SEASON_START \
            -e $END_DATE \
            -ws nowcast \
            -ts daily

          # Move Season Outputs to a dedicated folder
          mkdir -p output_season
          cp -r data/visuals/om_files_ice/* output_season/
          cp data/visuals/visual_ice_stats/* output_season/

      - name: Save Weekly and Seasonal Data Cache
        if: github.event.schedule == '0 2 * * 1'
        uses: actions/cache/save@v4
        with:
          path: |
            output_weekly
            output_season
          key: weekly-season-data-${{ github.run_id }}

      - name: Prepare Pages Directory
        run: |
          mkdir -p public/daily
          mkdir -p public/weekly
          mkdir -p public/season

          # Copy dashboard template and logo to root
          cp index_2.html public/index.html
          cp readme_files/noaa_logo.png public/noaa_logo.png || echo "Logo not found"

          # Inject current UTC timestamp into HTML
          sed -i "s/{{TIMESTAMP}}/$(date -u +'%Y-%m-%d %H:%M:%S UTC')/g" public/index.html

          # Copy scenario deliverables to their respective folders
          cp -r output_daily/* public/daily/

          # Conditionally copy weekly/seasonal if they exist (handling cache misses gracefully)
          [ -d "output_weekly" ] && cp -r output_weekly/* public/weekly/ || echo "No weekly data to copy"
          [ -d "output_season" ] && cp -r output_season/* public/season/ || echo "No season data to copy"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: run-skill-assessment
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
