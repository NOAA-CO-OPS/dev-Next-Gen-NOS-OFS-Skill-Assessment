name: Weekly and Season-to-Date Ice Skill Assessment

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-skill-assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib basemap plotly scipy scikit-learn pillow
          pip install -e .

      - name: Calculate Date Ranges & Run Weekly Scenario
        run: |
          # 1. Weekly Dates (Past 7 Days)
          WEEKLY_START=$(date -d "7 days ago" +%Y-%m-%dT00:00:00Z)
          END_DATE=$(date +%Y-%m-%dT23:59:59Z)

          echo "=== RUNNING WEEKLY SCENARIO ($WEEKLY_START to $END_DATE) ==="
          python bin/skill_assessment/do_iceskill_all_GLOFS_2.py \
            -p ./ \
            -s $WEEKLY_START \
            -e $END_DATE \
            -ws nowcast \
            -ts daily

          # Move Weekly Outputs to a dedicated folder
          mkdir -p output_weekly
          cp -r data/visuals/om_dir_ice/* output_weekly/
          # Clean intermediate visual folder before next run
          rm -rf data/visuals/om_dir_ice/*

      - name: Calculate Season-to-Date & Run Season Scenario
        run: |
          # Calculate Season Start Date (Nov 1st of current ice season)
          SEASON_START=$(python -c "from datetime import datetime; now = datetime.now(); season_year = now.year if now.month >= 11 else now.year - 1; print(f'{season_year}-11-01T00:00:00Z')")
          END_DATE=$(date +%Y-%m-%dT23:59:59Z)

          echo "=== RUNNING SEASON-TO-DATE SCENARIO ($SEASON_START to $END_DATE) ==="
          python bin/skill_assessment/do_iceskill_all_GLOFS_2.py \
            -p ./ \
            -s $SEASON_START \
            -e $END_DATE \
            -ws nowcast \
            -ts daily

          # Move Season Outputs to a dedicated folder
          mkdir -p output_season
          cp -r data/visuals/om_dir_ice/* output_season/

      - name: Prepare Pages Directory
        run: |
          mkdir -p public/weekly
          mkdir -p public/season

          # Copy dashboard template to root
          cp index.html public/

          # Copy scenario deliverables to their respective folders
          cp -r output_weekly/* public/weekly/
          cp -r output_season/* public/season/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: run-skill-assessment
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
