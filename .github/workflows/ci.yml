name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, "ci/**"]

# Least privilege by default. The `changes` job elevates to pull-requests:read
# for dorny/paths-filter on pull_request events.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the heavy OS×Python test matrix on docs-only changes.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        # Pin to full SHA (mutable tag was dorny/paths-filter@v3 / v3.0.4).
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'bin/**'
              - 'tests/**'
              - 'environment.yml'
              - 'pyproject.toml'
              - 'Makefile'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
              - '.secrets.baseline'

  lint:
    name: Lint (ruff + detect-secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.7.0" "detect-secrets==1.5.0"

      - name: Ruff
        run: ruff check src bin

      - name: detect-secrets
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install mypy and type stubs
        run: |
          python -m pip install --upgrade pip
          pip install "mypy==1.16.1" "types-requests>=2.31.0" "types-python-dateutil>=2.9.0"

      - name: mypy
        run: mypy src/ofs_skill

  docs:
    name: Docs (mkdocs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs tools
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.6.0" "mkdocs-material>=9.5.0"

      - name: MkDocs build (strict)
        run: mkdocs build --strict

  package:
    name: Package (build + twine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

  # Cross-platform suite: Ubuntu (primary fast path) + Windows + macOS × 3.11/3.12.
  # Install path matches INSTALL_WINDOWS.md Method A (environment.yml → editable pip).
  # Python 3.13 deferred until the conda-forge stack is ready.
  tests:
    name: Pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        # setup-micromamba activates the env for bash on Linux, macOS, and Windows.
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # environment.yml pins python=3.11.*; passing create-args python=3.12
      # keeps BOTH pins and the solver fails. Rewrite the pin for this cell.
      - name: Materialize matrix environment.yml
        shell: bash
        run: |
          sed "s/^  - python=3\\.11\\.\\*/  - python=${{ matrix.python-version }}/" \
            environment.yml > environment-ci.yml
          # Fail loudly if the pin in environment.yml changed shape and the
          # substitution above silently matched nothing.
          if ! grep -q "^  - python=${{ matrix.python-version }}$" environment-ci.yml; then
            echo "::error::Failed to rewrite python pin in environment.yml for ${{ matrix.python-version }}; update the sed pattern in ci.yml."
            grep -n '^  - python' environment-ci.yml || true
            exit 1
          fi

      - name: Set up micromamba
        # Pin to full SHA (mutable tag was mamba-org/setup-micromamba@v2 / v2.0.7).
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462  # v2.0.7
        with:
          environment-file: environment-ci.yml
          cache-environment: true
          cache-downloads: true
          # Bump trailing -vN to force a rebuild without editing environment.yml.
          cache-environment-key: env-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('environment.yml') }}-v2
          cache-downloads-key: downloads-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('environment.yml') }}-v2

      - name: Install package (editable, no deps)
        run: pip install -e . --no-deps

      - name: Run pytest
        env:
          PROJ_NETWORK: "ON"
        run: |
          # Unit + integration on every code PR. Live APIs stay on network-tests.yml.
          # coverage.xml is regenerated every run (never restored from cache).
          # Floor: pyproject.toml [tool.coverage.report] fail_under — ratchet up only.
          FLOOR="$(python scripts/coverage_summary.py --print-fail-under)"
          echo "Using coverage fail_under=${FLOOR} from pyproject.toml"
          pytest \
            -m "not network and not manual" \
            -n auto \
            --cov=src/ofs_skill \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under="${FLOOR}" \
            -o addopts=""

      - name: Coverage summary (repo-only)
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python scripts/coverage_summary.py coverage.xml --fail-under-from-pyproject

      - name: Reject lowering coverage floor vs base
        if: >
          github.event_name == 'pull_request' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.11'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          python scripts/coverage_summary.py \
            --check-floor-not-lowered \
            --base-ref "origin/${{ github.base_ref }}"

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
          # Do not cache coverage.xml across jobs/runs — always regenerate.
