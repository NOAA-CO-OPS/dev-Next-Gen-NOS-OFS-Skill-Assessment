name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, "ci/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.7.0" "detect-secrets==1.5.0"

      - name: Ruff
        run: ruff check src bin

      - name: detect-secrets
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install mypy and type stubs
        run: |
          python -m pip install --upgrade pip
          pip install "mypy==1.16.1" "types-requests>=2.31.0" "types-python-dateutil>=2.9.0"

      - name: mypy
        run: mypy src/ofs_skill

  docs:
    name: Docs (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs tools
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.6.0" "mkdocs-material>=9.5.0"

      - name: MkDocs build (strict)
        run: mkdocs build --strict

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          # Bump trailing -vN to force a rebuild without editing environment.yml.
          cache-environment-key: env-${{ runner.os }}-${{ hashFiles('environment.yml') }}-v1
          cache-downloads-key: downloads-${{ runner.os }}-${{ hashFiles('environment.yml') }}-v1

      - name: Install package (editable, no deps)
        run: pip install -e . --no-deps

      - name: Run pytest
        env:
          PROJ_NETWORK: "ON"
        run: |
          # Unit + integration on every PR. Live APIs stay on network-tests.yml.
          pytest \
            -m "not network and not manual" \
            -n auto \
            --cov=src/ofs_skill \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -o addopts=""

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
